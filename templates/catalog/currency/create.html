{% extends 'base.html' %}

{% block title %}Distrito 21 | Nueva Moneda{% endblock %}

{% block content %}
<div class="card mb-5 mb-xl-10">
    <div class="card-header border-0 pt-5">
        <h3 class="card-title align-items-start flex-column">
            <span class="card-label fw-bold fs-3 mb-1">Registrar Nueva Moneda</span>
            <span class="text-muted mt-1 fw-semibold fs-7">Añade una nueva divisa al sistema</span>
        </h3>
        <div class="card-toolbar">
            <a href="{% url 'catalog:currency_list' %}" class="btn btn-sm btn-light-primary">
                <i class="ki-duotone ki-arrow-left fs-3"><span class="path1"></span><span class="path2"></span></i> Volver
            </a>
        </div>
    </div>

    <form method="post" class="form">
        {% csrf_token %}
        <div class="card-body border-top p-9">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger d-flex align-items-center p-5 mb-10">
                        <i class="ki-duotone ki-shield-cross fs-2hx text-danger me-4"><span class="path1"></span><span class="path2"></span></i>
                        <div class="d-flex flex-column"><span>{{ message }}</span></div>
                    </div>
                {% endfor %}
            {% endif %}

            <div class="row mb-6">
                <div class="col-lg-6 fv-row">
                    <label class="form-label required fw-semibold fs-6">Nombre de la Moneda</label>
                    <input type="text" name="name" value="{{ name|default:'' }}" class="form-control form-control-solid bg-transparent" placeholder="Ej. Peso Mexicano, Dólar Estadounidense" required />
                </div>
                <div class="col-lg-6 fv-row">
                    <label class="form-label required fw-semibold fs-6">Código ISO</label>
                    <input type="text" name="code" value="{{ code|default:'' }}" class="form-control form-control-solid bg-transparent" placeholder="Ej. MXN, USD" required />
                </div>
            </div>
        </div>

        <div class="card-footer d-flex justify-content-end py-6 px-9">
            <a href="{% url 'catalog:currency_list' %}" class="btn btn-light me-3">Cancelar</a>
            <button type="submit" class="btn btn-primary">Guardar Moneda</button>
        </div>
    </form>
</div>
{% endblock %}
