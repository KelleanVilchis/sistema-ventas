{% extends 'base.html' %}
{% block title %}Comenzar Día{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card shadow-lg" style="max-width: 480px; width: 100%;">
        <div class="card-body p-10 text-center">
            <i class="ki-duotone ki-time fs-5x text-primary mb-5"><span class="path1"></span><span class="path2"></span></i>
            <h2 class="fw-bold mb-2">Comenzar Día</h2>
            <p class="text-muted mb-8">Ingresa el fondo de caja inicial para abrir el turno.</p>

            <form method="post" action="{% url 'sales:shift_open' %}">
                {% csrf_token %}
                <div class="mb-6 text-start">
                    <label class="form-label required fw-bold fs-6">Fondo de caja inicial</label>
                    <input type="number" name="opening_cash" step="0.01" min="0" value="0" required
                           class="form-control form-control-lg form-control-solid text-center fs-2 fw-bold">
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">
                    <i class="ki-duotone ki-check-circle fs-3 me-2"><span class="path1"></span><span class="path2"></span></i>
                    Abrir Turno
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
