{% extends 'base.html' %}

{% block title %}Distrito 21 | Nuevo Gasto{% endblock %}

{% block content %}
<div class="card mb-5 mb-xl-10">
    <div class="card-header border-0 pt-5">
        <h3 class="card-title align-items-start flex-column">
            <span class="card-label fw-bold fs-3 mb-1">Registrar Nuevo Gasto</span>
            <span class="text-muted mt-1 fw-semibold fs-7">Añade un egreso operativo al sistema</span>
        </h3>
        <div class="card-toolbar">
            <a href="{% url 'sales:expense_list' %}" class="btn btn-sm btn-light-primary">
                <i class="ki-duotone ki-arrow-left fs-3"><span class="path1"></span><span class="path2"></span></i> Volver
            </a>
        </div>
    </div>

    <form method="post" class="form">
        {% csrf_token %}
        <div class="card-body border-top p-9">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger d-flex align-items-center p-5 mb-10">
                        <i class="ki-duotone ki-shield-cross fs-2hx text-danger me-4"><span class="path1"></span><span class="path2"></span></i>
                        <div class="d-flex flex-column"><span>{{ message }}</span></div>
                    </div>
                {% endfor %}
            {% endif %}

            <div class="row mb-6">
                <div class="col-lg-6 fv-row mb-4 mb-lg-0">
                    <label class="form-label required fw-semibold fs-6">Monto</label>
                    <input type="number" step="0.01" min="0" name="amount" value="{{ amount|default:'' }}" class="form-control form-control-solid bg-transparent" placeholder="0.00" required />
                </div>
                <div class="col-lg-6 fv-row">
                    <label class="form-label fw-semibold fs-6">Moneda</label>
                    <select name="currency" class="form-select form-select-solid bg-transparent">
                        <option value="">Selecciona una moneda...</option>
                        {% for cur in currencies %}
                            <option value="{{ cur.id }}" {% if currency_id == cur.id|stringformat:"i" %}selected{% endif %}>{{ cur.name }} ({{ cur.code }})</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row mb-6">
                <div class="col-lg-6 fv-row">
                    <label class="form-label required fw-semibold fs-6">Estado</label>
                    <select name="status" class="form-select form-select-solid bg-transparent" required>
                        {% for code, label in status_choices %}
                            <option value="{{ code }}" {% if status == code or code == 'PENDING' and not status %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-lg-6 fv-row">
                    <label class="form-label required fw-semibold fs-6">Fecha y Hora del Gasto</label>
                    <input type="datetime-local" name="date_expense" class="form-control form-control-solid bg-transparent" required />
                </div>
            </div>
            <div class="row mb-6">
                <div class="col-lg-12 fv-row">
                    <label class="form-label required fw-semibold fs-6">Descripción del Gasto</label>
                    <textarea name="description" class="form-control form-control-solid bg-transparent" rows="3" placeholder="Detalle del egreso..." required>{{ description|default:'' }}</textarea>
                </div>
            </div>
        </div>

        <div class="card-footer d-flex justify-content-end py-6 px-9">
            <a href="{% url 'sales:expense_list' %}" class="btn btn-light me-3">Cancelar</a>
            <button type="submit" class="btn btn-primary">Guardar Gasto</button>
        </div>
    </form>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const dateInput = document.querySelector('input[name="date_expense"]');
        if (dateInput && !dateInput.value) {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            dateInput.value = now.toISOString().slice(0, 16);
        }
    });
</script>
{% endblock %}
